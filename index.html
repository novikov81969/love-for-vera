<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0a0f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Нажимай на сердце, чтобы открыть поздравление.">
  <title>Для тебя</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff4fa3' d='M12 21s-7.5-4.7-9.7-9.1C.6 8.5 2.4 5 5.8 5c2 0 3.4 1.2 4.2 2.3C10.8 6.2 12.2 5 14.2 5c3.4 0 5.2 3.5 3.5 6.9C19.5 16.3 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="intro.css?v=5">
  <link rel="prefetch" href="letter.html?v=5">
</head>
<body>
  <main class="scene" id="scene">
    <canvas class="scene__canvas" id="stage" aria-label="Сердце. Нажимай, чтобы наполнить его"></canvas>

    <div class="hud">
      <p class="hud__title" id="title">Нажми здесь</p>
      <p class="hud__sub">Нажимай без остановки - сердце наполняется.</p>
      <div class="meter" id="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="meter__fill" id="meter-fill"></span>
      </div>
    </div>

    <div class="burst" id="burst" aria-hidden="true">
      <span class="burst__flash"></span>
      <span class="burst__ring"></span>
      <span class="burst__ring burst__ring--late"></span>
      <span class="burst__glow"></span>
    </div>
  </main>

  <div class="fade" id="fade" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">Для этой страницы нужен JavaScript.</div>
  </noscript>

  <script src="intro.js?v=5"></script>
</body>
</html>
