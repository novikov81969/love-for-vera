<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030006">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Поздравление с Днём Рождения, собранное из светящихся частиц.">
  <title>С Днём Рождения, любимая!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff4fa3' d='M12 21s-7.5-4.7-9.7-9.1C.6 8.5 2.4 5 5.8 5c2 0 3.4 1.2 4.2 2.3C10.8 6.2 12.2 5 14.2 5c3.4 0 5.2 3.5 3.5 6.9C19.5 16.3 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="experience" id="experience">
    <canvas class="code-rain" id="code-rain" aria-hidden="true"></canvas>
    <canvas class="particles" id="particles" aria-hidden="true"></canvas>

    <div class="heart-aura" id="heart-aura" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <section class="dedication" id="dedication" aria-hidden="true">
      <p class="dedication__lead" id="dedication-lead">С Днём Рождения,</p>
      <p class="dedication__name" id="dedication-name">любимая!</p>
    </section>

    <div class="hint" id="hint" aria-hidden="true">
      <span class="hint__line"></span>
      <span id="hint-label">коснись света</span>
      <span class="hint__line"></span>
    </div>

    <div class="controls" id="controls">
      <button class="control" id="replay" type="button" aria-label="Запустить анимацию заново" title="Смотреть снова (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.34 5.66"></path>
          <path d="M20 4v7h-7"></path>
        </svg>
      </button>
      <button class="control" id="fullscreen" type="button" aria-label="Открыть на весь экран" title="На весь экран (F)">
        <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5"></path>
          <path d="M16 3h5v5"></path>
          <path d="M8 21H3v-5"></path>
          <path d="M16 21h5v-5"></path>
        </svg>
        <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 8h5V3"></path>
          <path d="M21 8h-5V3"></path>
          <path d="M3 16h5v5"></path>
          <path d="M21 16h-5v5"></path>
        </svg>
      </button>
    </div>

    <p class="sr-only" id="live-message" aria-live="polite"></p>
  </main>

  <noscript>
    <div class="noscript">Для этой анимации нужен JavaScript.</div>
  </noscript>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
